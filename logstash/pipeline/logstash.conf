
input {
  beats {
    port => 5044
  }
}

filter {

  # ==================================================
  # 1. Nginx 접속 로그 필드 변환
  # ==================================================
  if [log_type] == "nginx" {

    mutate {
      replace => {
        "source" => "nginx-access"
      }
      copy => {
        "remote_addr"      => "client_ip"
        "request_method"   => "method"
        "uri"              => "path"
        "args"             => "query_string"
        "status"           => "status_code"
        "request_time"     => "response_time"
        "body_bytes_sent"  => "response_size"
        "http_user_agent"  => "user_agent"
        "http_referer"     => "referer"
      }
    }
  }

  # ==================================================
  # 2. Flask 인증 로그 필드 변환
  # ==================================================
  else if [log_type] == "auth" {

    mutate {
      replace => {
        "source" => "app-auth"
      }
      copy => {
        "remote_addr"     => "client_ip"
        "username"        => "user_id"
        "result"          => "login_result"
        "http_user_agent" => "user_agent"
      }
    }
  }

  # ==================================================
  # 3. 시간 변환
  # Nginx: KST 오프셋 포함 ISO8601
  # Flask: UTC ISO8601
  # Elasticsearch @timestamp: UTC 기준
  # ==================================================
  if [time] {
    date {
      match => ["time", "ISO8601"]
      target => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
    }
  }

  # ==================================================
  # 4. 숫자 필드 타입 변환
  # ==================================================
  mutate {
  remove_field => ["host"]
  convert => {
    "status_code" => "integer"
    "response_time" => "float"
    "response_size" => "integer"
    "status" => "integer"
    "body_bytes_sent" => "integer"
    "request_length" => "integer"
    "request_time" => "float"
  }
}

  # ==================================================
  # 5. URL 및 보안 전처리
  # ==================================================
  ruby {
    init => '
      require "cgi"
      require "ipaddr"

      @max_len = 4096
      @max_decode = 3

      @static_ext = [
        ".css", ".js", ".map", ".png", ".jpg", ".jpeg",
        ".gif", ".svg", ".webp", ".ico", ".woff", ".woff2",
        ".ttf", ".eot"
      ]

      @static_paths = [
        "/favicon.ico", "/robots.txt", "/sitemap.xml"
      ]

      @scanner_ua = [
        "nikto", "gobuster", "dirbuster", "ffuf",
        "wpscan", "sqlmap", "nmap"
      ]

      @automation_ua = [
        "curl", "wget", "python-requests", "go-http-client"
      ]

      # URL 파라미터의 인증정보 마스킹
      @mask = lambda do |value|
        value.to_s.gsub(
          /((?:password|passwd|pwd|token|access_token|api_key|secret)=)[^&\s]*/i
        ) { "#{$1}***" }
      end

      # URL 디코딩: 최대 3회
      # + 문자는 공백으로 바뀌지 않도록 보호
      @decode = lambda do |value|
        current = value.to_s
        count = 0

        @max_decode.times do
          decoded = CGI.unescape(
            current.gsub("+", "%2B")
          ).scrub("?")

          break if decoded == current

          current = decoded
          count += 1
        end

        [current, count]
      end
    '

    code => '
      # -----------------------------------------------
      # IP 주소 유효성 검사
      # -----------------------------------------------
      ip = event.get("client_ip")

      if ip && !ip.to_s.empty?
        begin
          IPAddr.new(ip.to_s)
        rescue
          event.tag("invalid_client_ip")
          event.remove("client_ip")
        end
      end

      # -----------------------------------------------
      # Nginx URI 처리
      # -----------------------------------------------
      uri = event.get("request_uri").to_s
      path = event.get("path").to_s
      args = event.get("query_string").to_s

      if uri.empty? && !path.empty?
        uri = path
        uri += "?" + args unless args.empty?
      end

      unless uri.empty?

        # 길이 제한
        uri = uri[0, @max_len]

        # URL 디코딩
        decoded_uri, decode_count = @decode.call(uri)

        # 민감한 URL 파라미터 마스킹
        decoded_uri = @mask.call(decoded_uri)

        # 원본 요청 URI와 디코딩 URI 보존
        event.set("decoded_uri", decoded_uri)
        event.set("request_uri", decoded_uri)
        event.set("decode_count", decode_count)

        # 원본 query string의 비밀번호 등 마스킹
        unless args.empty?
          decoded_args, _ = @decode.call(args)
          masked_args = @mask.call(decoded_args)

          event.set("args", masked_args)
          event.set("query_string", masked_args)
        end

        # ---------------------------------------------
        # 정규화 경로 생성
        # ---------------------------------------------
        decoded_path, _ = @decode.call(path)

        normalized_path = decoded_path.downcase.gsub("\\", "/").gsub(%r{/{2,}}, "/")
        normalized_path = normalized_path.chomp("/") if normalized_path.length > 1

        normalized_path = "/" if normalized_path.empty?

        event.set("normalized_path", normalized_path)

        # 정적 파일 여부
        ext = File.extname(normalized_path)

        is_static =
          @static_ext.include?(ext) ||
          @static_paths.include?(normalized_path)

        event.set("is_static", is_static)

      end

      # -----------------------------------------------
      # HTTP 상태 코드 분류
      # -----------------------------------------------
      status = event.get("status_code").to_i

      if status > 0
        event.set("status_class", "#{status / 100}xx")
      end

      # -----------------------------------------------
      # User-Agent 분류
      # -----------------------------------------------
      ua = event.get("user_agent").to_s.downcase

      ua_type =
        if ua.empty?
          "MISSING"
        elsif @scanner_ua.any? { |item| ua.include?(item) }
          "KNOWN_SCANNER"
        elsif @automation_ua.any? { |item| ua.include?(item) }
          "AUTOMATION_CLIENT"
        elsif ua.start_with?("mozilla")
          "BROWSER"
        else
          "OTHER"
        end

      event.set("user_agent_type", ua_type)

      # -----------------------------------------------
      # 불필요한 빈 문자열 제거
      # -----------------------------------------------
      [
        "x_forwarded_for",
        "referer",
        "query_string"
      ].each do |field|

        event.remove(field) if event.get(field) == ""

      end
    '
  }
}

# ==================================================
# 7. Elasticsearch 저장
# ==================================================
#output {
#  elasticsearch {
#    hosts => ["${ES_HOSTS}"]
#     index => "weblog-raw-%{+YYYY.MM.dd}"
#  }
#}
output {
  elasticsearch {
    hosts => ["${ES_HOSTS}"]
    index => "weblog-raw-%{+YYYY.MM.dd}"
  }
}