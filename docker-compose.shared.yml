# 팀 공용 서버 모드 (Tailscale 경유 접속)
#
# 사용법 (호스트 PC에서):
#   docker compose -f docker-compose.yml -f docker-compose.shared.yml up -d
#
# 기본 설정(127.0.0.1)은 그대로 두고, Tailscale 주소로도 포트를 추가로 엽니다.
# Tailscale 주소는 팀원(공유받은 사람)만 접속할 수 있으므로 인터넷에는 노출되지 않습니다.
# 자세한 내용: docs/shared-server.md

services:
  nginx:
    ports:
      - "${TAILSCALE_IP:?.env 에 TAILSCALE_IP 를 설정하세요 (tailscale ip -4)}:${NGINX_HTTP_PORT}:80"

  elasticsearch:
    ports:
      - "${TAILSCALE_IP:?.env 에 TAILSCALE_IP 를 설정하세요 (tailscale ip -4)}:9200:9200"

  kibana:
    ports:
      - "${TAILSCALE_IP:?.env 에 TAILSCALE_IP 를 설정하세요 (tailscale ip -4)}:5601:5601"
