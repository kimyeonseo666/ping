# 웹로그 수집 분석 & 시각화 - 로컬 개발 환경
# 흐름: client -> nginx -> app
#       nginx/app 로그 파일 -> filebeat -> logstash -> elasticsearch -> kibana
#
# 주의: 개발용 설정입니다. Elasticsearch 보안(xpack.security)이 꺼져 있으므로
#       EC2 등 외부에 노출되는 환경에 그대로 올리지 마세요.
#       모든 포트는 127.0.0.1(내 PC)에서만 열립니다.
#       팀 공용 서버로 쓸 때는 docker-compose.shared.yml 을 함께 사용
#
# 시연용 트래픽 (고정 IP로 공격자/정상 사용자 구분)
#   정상 사용자 3명 (172.20.0.20~22):  docker compose --profile traffic up -d
#   공격자 자리 (172.20.0.10):         docker compose --profile attack up -d
#                                      docker compose exec attacker python /scripts/<스크립트>.py
#   공격 스크립트는 attack-scripts/ 에 두며, 대상은 이 compose 환경(http://nginx)으로만 한정한다.

x-normal-user: &normal-user
  build: ./traffic
  profiles: ["traffic"]
  depends_on:
    - nginx
  restart: unless-stopped

services:
  app:
    build: ./app
    container_name: ping-app
    volumes:
      - ./logs/app:/var/log/app
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    image: nginx:${NGINX_VERSION}
    container_name: ping-nginx
    depends_on:
      - app
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx-json
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: ping-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms${ES_HEAP} -Xmx${ES_HEAP}
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    container_name: ping-logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - ES_HOSTS=http://elasticsearch:9200
    volumes:
      - ./logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      # 인덱스 템플릿 (Logstash elasticsearch output 의 template 옵션에서 사용)
      - ./elasticsearch/mappings:/usr/share/logstash/templates:ro
    expose:
      - "5044"
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION}
    container_name: ping-filebeat
    user: root
    # Windows 바인드 마운트는 파일 권한 검사를 통과하지 못하므로 strict.perms 비활성화
    command: ["filebeat", "-e", "--strict.perms=false"]
    depends_on:
      - logstash
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs/nginx:/logs/nginx:ro
      - ./logs/app:/logs/app:ro
      - filebeat-data:/usr/share/filebeat/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: ping-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    restart: unless-stopped

  # ---------- 시연용 트래픽 (profile 로 필요할 때만 실행) ----------

  normal-user-1:
    <<: *normal-user
    container_name: ping-normal-user-1
    environment:
      - USERNAME=member1
      - PASSWORD=member1-pw
    networks:
      default:
        ipv4_address: 172.20.0.20

  normal-user-2:
    <<: *normal-user
    container_name: ping-normal-user-2
    environment:
      - USERNAME=member2
      - PASSWORD=member2-pw
    networks:
      default:
        ipv4_address: 172.20.0.21

  normal-user-3:
    <<: *normal-user
    container_name: ping-normal-user-3
    environment:
      - USERNAME=member3
      - PASSWORD=member3-pw
    networks:
      default:
        ipv4_address: 172.20.0.22

  # 공격자 자리: 고정 IP만 잡아 두고 대기. 실행할 스크립트는 attack-scripts/ 에서 관리
  attacker:
    build: ./traffic
    container_name: ping-attacker
    profiles: ["attack"]
    command: ["sleep", "infinity"]
    depends_on:
      - nginx
    volumes:
      - ./attack-scripts:/scripts:ro
    networks:
      default:
        ipv4_address: 172.20.0.10

networks:
  default:
    ipam:
      config:
        # 172.20.0.2~127 은 고정 IP 용, 자동 배정은 172.20.0.128~ 에서만 (충돌 방지)
        - subnet: 172.20.0.0/24
          ip_range: 172.20.0.128/25
          gateway: 172.20.0.1

volumes:
  es-data:
  filebeat-data:
